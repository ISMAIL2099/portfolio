<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <nav class="navbar sticky-top" style="background-color: #98FB98">
        <div class="container-fluid">
            <a class="navbar-brand" href="accueilConnecter.html">SUPER APPLI</a>
        </div>
    </nav>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Tableau des Éléments</h2>
        
        <!-- Tableau avec des classes Bootstrap -->
        <table class="table table-bordered table-striped" id="dynamic-table">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>qui</th>
                    <th>Quand</th>
                    <th>Ou</th>
                    <th>comment/combein</th>
                    <th>Actions</th> <!-- Colonne des actions (supprimer / modif) -->

                </tr>
            </thead>
            <tbody>
                <!-- Le contenu du tableau sera rempli ici par JavaScript -->
            </tbody>
        </table>

        <!-- Lien vers la page d'ajout -->
        <a href="remplissage.html" class="btn btn-link">Ajouter un Élément</a>
    </div>

    <!-- Script Bootstrap pour le bon fonctionnement des composants -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script JavaScript pour remplir le tableau avec les données -->
    <script>
        // Fonction pour remplir le tableau avec les données du localStorage
        function remplirTableau() {
            const tbody = document.querySelector('#dynamic-table tbody');

            // Récupérer les données depuis le localStorage
            const data = JSON.parse(localStorage.getItem('tableauData')) || [];

            // Effacer le tableau actuel avant d'ajouter les nouvelles données
            tbody.innerHTML = '';

            // Ajouter chaque élément du tableau à l'affichage
            data.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.qui}</td>
                    <td>${item.quand}</td>
                    <td>${item.ou}</td>
                    <td>${item.CommentCombien}<td>
                    <td>
                        <button class="btn btn-primary btn-sm" onclick="modifierElement(${item.id})">Modifier</button>
                        <button class="btn btn-danger btn-sm" onclick="supprimerElement(${item.id})">Supprimer</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // Fonction pour rediriger vers la page de modification avec les données de l'élément
        function modifierElement(id) {
            window.location.href = `remplissage.html?id=${id}`;
        }

         // Fonction pour supprimer un élément du tableau
        function supprimerElement(id) {
            // Récupérer les données actuelles
            const data = JSON.parse(localStorage.getItem('tableauData')) || [];

            // Filtrer pour supprimer l'élément avec l'ID donné
            const newData = data.filter(item => item.id !== id);

            // Mettre à jour le localStorage avec les nouvelles données
            localStorage.setItem('tableauData', JSON.stringify(newData));

            // Rafraîchir le tableau après la suppression
            remplirTableau();
        }

        // Appeler la fonction pour remplir le tableau au chargement de la page
        window.onload = remplirTableau;
    </script>


    <!-- Script Bootstrap pour le bon fonctionnement des composants -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Footer sticky (pied de page) -->
        <footer class="text-center py-3 mt-auto fixed-bottom" style="background-color: #98FB98">
            <p>&copy; 2025 Mon Application. Tous droits réservés.</p>
        </footer>
</body>
</html>
